
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTalks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>MoneyTalks</h1>
        <p class="deskripsi">Catatan keuangan mahasiswa kos</p>

        <section class="kartu">
            <h2>Uang Bulanan</h2>
            <input type="number" id="uangBulanan" placeholder="Masukkan uang bulanan">
            <button type="button" id="simpanBulanan">Simpan</button>
            <p id="pesanBulanan" class="error"></p>
            <h3>Jatah Harian</h3>
            <p id="jatahHarian" class="angka">Rp0</p>
        </section>

        <section class="kartu">
            <h2>Tambah Transaksi</h2>
            <form id="formTransaksi">
                <label>Tanggal</label>
                <input type="date" id="tanggal" required>

                <label>Jenis</label>
                <select id="jenis" required>
                    <option value="pemasukan">Pemasukan</option>
                    <option value="pengeluaran">Pengeluaran</option>
                </select>

                <label>Kategori</label>
                <select id="kategori" required>
                    <option value="">Pilih kategori</option>
                    <option value="Uang Saku">Uang Saku</option>
                    <option value="Makan">Makan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Transport">Transport</option>
                    <option value="Belanja">Belanja</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>

                <label>Nominal</label>
                <input type="number" id="nominal" min="1" placeholder="Contoh: 25000" required>

                <label>Catatan</label>
                <input type="text" id="catatan" placeholder="Opsional">

                <p id="pesanError" class="error"></p>
                <button type="submit">Tambah Transaksi</button>
            </form>
        </section>

        <section class="kartu">
            <h2>Daftar Transaksi</h2>
            <ul id="daftarTransaksi"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
